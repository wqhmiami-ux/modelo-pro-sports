name: Validate Modelo PRO Sports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML structure and inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          source = Path("index.html")
          if not source.is_file():
              sys.exit("ERROR: index.html no existe en la raíz del repositorio.")

          class AppParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.ids = []
                  self.anchors = []
                  self.scripts = []
                  self.current_script = None
                  self.html_lang = None
                  self.title_seen = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "html":
                      self.html_lang = attrs.get("lang")
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "a" and attrs.get("href", "").startswith("#"):
                      self.anchors.append(attrs["href"][1:])
                  if tag == "script":
                      self.current_script = []
                      self.scripts.append(self.current_script)

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.current_script = None

              def handle_data(self, data):
                  if self.current_script is not None:
                      self.current_script.append(data)

          parser = AppParser()
          parser.feed(source.read_text(encoding="utf-8"))
          parser.close()

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              sys.exit("ERROR: IDs HTML duplicados: " + ", ".join(duplicates))

          id_set = set(parser.ids)
          missing = sorted({anchor for anchor in parser.anchors if anchor and anchor not in id_set})
          if missing:
              sys.exit("ERROR: enlaces internos sin destino: " + ", ".join(missing))

          import re
          combined_scripts = "\n".join("".join(chunks) for chunks in parser.scripts)
          referenced_ids = set(re.findall(r"\$\(\s*['\"]([A-Za-z][\w-]*)['\"]\s*\)", combined_scripts))
          referenced_ids.update(re.findall(r"getElementById\(\s*['\"]([^'\"]+)['\"]\s*\)", combined_scripts))
          missing_ids = sorted(referenced_ids - id_set)
          if missing_ids:
              sys.exit("ERROR: JavaScript referencia IDs inexistentes: " + ", ".join(missing_ids))

          if parser.html_lang != "es":
              sys.exit("ERROR: el documento debe declarar lang=\"es\".")

          if not parser.scripts:
              sys.exit("ERROR: no se encontraron scripts para validar.")

          import subprocess
          import tempfile
          for index, chunks in enumerate(parser.scripts):
              script = "".join(chunks)
              with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8") as handle:
                  handle.write(script)
                  handle.flush()
                  result = subprocess.run(["node", "--check", handle.name], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      sys.exit(f"ERROR: sintaxis JavaScript inválida en el script inline #{index + 1}.")

          print(f"OK: {len(parser.ids)} IDs únicos, {len(parser.anchors)} enlaces internos válidos y {len(parser.scripts)} scripts JavaScript con sintaxis correcta.")
          PY

      - name: Validate Cloudflare Worker JavaScript syntax
        run: node --check cloudflare-worker-oddslink.js

      - name: Verify live-data endpoint and sport contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          app = Path("index.html").read_text(encoding="utf-8")
          worker = Path("cloudflare-worker-oddslink.js").read_text(encoding="utf-8")
          expected = [
              "americanfootball_nfl",
              "basketball_nba",
              "baseball_mlb",
              "icehockey_nhl",
              "soccer_epl",
              "soccer",
              "mma_mixed_martial_arts",
          ]
          errors = []
          for sport in expected:
              if sport not in worker:
                  errors.append(f"El Worker no declara el deporte {sport}.")
              if sport not in app:
                  errors.append(f"La aplicación no comprueba el deporte {sport}.")
          for endpoint in ("/api/odds", "/api/football"):
              if endpoint not in worker:
                  errors.append(f"Falta el endpoint {endpoint} en el Worker.")
          if "https://modelo-pro-api.wqhmiami.workers.dev/api/odds" not in app:
              errors.append("La aplicación no apunta al endpoint de cuotas configurado.")
          if 'api.searchParams.set("homeTeam", homeName)' not in app or 'api.searchParams.set("awayTeam", awayName)' not in app:
              errors.append("El modelo de fútbol no solicita muestras específicas de ambos equipos.")
          if "fetchTeamMatches(homeTeam.id)" not in worker or "fetchTeamMatches(awayTeam.id)" not in worker:
              errors.append("El Worker no obtiene el historial de ambos equipos por separado.")
          if 'teamUrl.searchParams.set("limit", "20")' not in worker:
              errors.append("El Worker no solicita el tamaño de muestra esperado por equipo.")
          if "Math.min(200, Math.floor(requestedLimit))" not in worker:
              errors.append("El Worker no limita de forma segura el tamaño de muestra de resultados.")
          if "data.matches.slice(0, competitionLimit)" not in worker:
              errors.append("El Worker no aplica el límite solicitado al devolver partidos.")
          if 'Cache-Control": "public, max-age=30"' not in worker or 'caches.default.put(cacheKey' not in worker:
              errors.append("El Worker no cachea temporalmente las cuotas para reducir llamadas repetidas.")
          if r".replace(/[\u0300-\u036f]/g," not in worker:
              errors.append("La normalización de nombres debe eliminar correctamente los acentos Unicode.")
          if r".replace(/\b(fc|afc|cf|sc)\b/g," not in worker:
              errors.append("La normalización de nombres debe quitar sufijos de clubes usando límites de palabra.")
          if errors:
              sys.exit("\\n".join(errors))
          print("OK: Worker y aplicación declaran los seis deportes y los endpoints esperados.")
          PY

      - name: Verify market-reference safety guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          app = Path("index.html").read_text(encoding="utf-8")
          required = {
              "dedicated market-reference state": "let marketProbabilityReferenceLoaded = false;",
              "guard blocks imported market probabilities": "marketProbabilityReferenceLoaded || /^Referencia de mercado sin margen/i.test(sourceNotes)",
              "user must clear imported probability first": 'if (marketProbabilityReferenceLoaded && $("prob").value.trim() === "")',
              "market reference is explicitly labeled": "No es una estimación independiente",
          }
          missing = [label for label, snippet in required.items() if snippet not in app]
          if missing:
              sys.exit("ERROR: falta la protección de transparencia: " + ", ".join(missing))
          print("OK: una probabilidad importada del mercado no puede generar recomendación hasta borrarla y reemplazarla.")
          PY
